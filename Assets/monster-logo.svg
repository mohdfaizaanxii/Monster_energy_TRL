<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="claw-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39FF14" />
      <stop offset="60%" stop-color="#00FF41" />
      <stop offset="100%" stop-color="#00C832" />
    </linearGradient>
  </defs>

  <!-- Outer Ring Badge -->
  <circle cx="50" cy="50" r="47" fill="#090b10" stroke="#00FF41" stroke-width="2.5" stroke-opacity="0.5" />
  
  <!-- Monster Energy Iconic 3-Claw "M" Scratch -->
  <g filter="url(#neon-glow)" fill="url(#claw-grad)">
    <!-- Left Claw Scratch -->
    <path d="M28 18 
             C29 25, 27 34, 25 44 
             C24 49, 21 58, 20 64 
             C19 70, 16 78, 15 82 
             C16 80, 20 73, 23 66 
             C26 59, 29 48, 30 40 
             C31 32, 33 24, 34 19 
             Z" />
    
    <!-- Middle Center Claw Scratch -->
    <path d="M48 11 
             C50 20, 49 32, 47 45 
             C45 57, 43 70, 40 82 
             C38 87, 36 93, 35 96 
             C37 93, 42 84, 46 74 
             C50 62, 53 48, 55 35 
             C56 24, 57 16, 56 12 
             Z" />
    
    <!-- Right Claw Scratch -->
    <path d="M68 20 
             C70 28, 69 38, 66 48 
             C64 56, 61 65, 59 72 
             C57 78, 55 83, 54 86 
             C56 83, 60 76, 64 68 
             C67 60, 71 49, 73 39 
             C74 30, 75 24, 74 21 
             Z" />

    <!-- Sharp Scratch Splatters / Claw Jagged Barbs -->
    <polygon points="15,82 17,84 19,79" />
    <polygon points="35,96 38,98 40,92" />
    <polygon points="54,86 56,88 58,83" />
    <polygon points="26,45 28,47 27,41" />
    <polygon points="48,46 51,48 49,42" />
    <polygon points="67,49 70,51 68,45" />
